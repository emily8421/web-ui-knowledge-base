name: Project Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --check --no-commit-id --root -r "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          fi

      - name: Check project version consistency
        shell: bash
        run: |
          version="$(tr -d '\r\n[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use vMAJOR.MINOR.PATCH, got: ${version:-<empty>}" >&2
            exit 1
          fi
          first_changelog_version="$(grep -E '^## v[0-9]+\.[0-9]+\.[0-9]+（' CHANGELOG.md | head -n 1 | sed -E 's/^## (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          if [[ -z "$first_changelog_version" ]]; then
            echo "CHANGELOG.md must start its project history with a ## vMAJOR.MINOR.PATCH（...） heading" >&2
            exit 1
          fi
          if [[ "$first_changelog_version" != "$version" ]]; then
            echo "CHANGELOG latest project version $first_changelog_version does not match VERSION $version" >&2
            exit 1
          fi

      - name: Check template sync boundary
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^sync[[:space:]]template[[:space:]]v[0-9]+\.[0-9]+\.[0-9]+[[:space:]]from[[:space:]]ai-project-template([[:space:]]\(#[0-9]+\))?$ ]]; then
            bash scripts/check-derived-sync.sh HEAD
          else
            echo "Not a template sync commit; skip derived sync boundary check."
          fi
